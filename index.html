<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>London Explorer</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
  html,body{height:100%;margin:0;font-family:-apple-system,system-ui,sans-serif}
  #map{position:absolute;inset:0}
  #panel{position:absolute;z-index:1000;left:8px;right:8px;top:calc(8px + env(safe-area-inset-top,0px));
    background:rgba(255,255,255,.95);border-radius:12px;padding:10px 12px;box-shadow:0 2px 10px rgba(0,0,0,.25);
    font-size:14px;color:#111}
  #stats{display:flex;gap:16px;margin-bottom:8px}
  #stats div{flex:1}
  .big{font-size:20px;font-weight:700}
  .sub{color:#555;font-size:12px}
  .bar{height:6px;background:#e5e7eb;border-radius:3px;margin-top:3px;overflow:hidden}
  .bar i{display:block;height:100%;width:0}
  #b1{background:#2563eb}#b2{background:#f59e0b}
  button,label.btn{font:inherit;padding:7px 10px;border:0;border-radius:8px;background:#2563eb;color:#fff;margin-right:6px;display:inline-block}
  button.alt{background:#6b7280}
  #msg{margin-top:6px;font-size:12px;color:#444;min-height:14px}
</style>
</head>
<body>
<div id="map"></div>
<div id="panel">
  <div id="stats">
    <div><div class="big" id="s1">–</div><div class="sub" id="s1t">streets walked</div><div class="bar"><i id="b1"></i></div></div>
    <div><div class="big" id="s2">–</div><div class="sub" id="s2t">cafes visited</div><div class="bar"><i id="b2"></i></div></div>
  </div>
  <label class="btn">Import walks<input id="file" type="file" multiple hidden></label>
  <button class="alt" id="all">Load all London</button>
  <div id="msg">Import Timeline.json (Google Maps) or GPX files.</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script>
const $ = id => document.getElementById(id);
const msg = t => $('msg').textContent = t;
const COSLAT = Math.cos(51.5 * Math.PI / 180);
const dist = (a, b) => Math.hypot((a[1]-b[1])*COSLAT*111320, (a[0]-b[0])*110540);

// ---------- storage (IndexedDB) ----------
const db = new Promise((res, rej) => {
  const r = indexedDB.open('london-explorer', 1);
  r.onupgradeneeded = () => r.result.createObjectStore('kv');
  r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
});
async function kvGet(k, d) { const d0 = await db; return new Promise(res => { const q = d0.transaction('kv').objectStore('kv').get(k); q.onsuccess = () => res(q.result ?? d); q.onerror = () => res(d); }); }
async function kvSet(k, v) { const d0 = await db; return new Promise(res => { const t = d0.transaction('kv', 'readwrite'); t.objectStore('kv').put(v, k); t.oncomplete = res; t.onerror = res; }); }

let tracks = {};   // filename -> [[lat,lon],...]
let cells = {};    // cellKey -> {ways:[{id,pts}], cafes:[{id,name,lat,lon}]}
let loadedKeys = new Set(); // cells included in stats
let skipped = 0;

// ---------- map ----------
const map = L.map('map', { preferCanvas: true, zoomControl: false }).setView([51.5074, -0.1278], 13);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '© OpenStreetMap' }).addTo(map);
const layer = L.layerGroup().addTo(map);


// ---------- Google Timeline.json ----------
function parseLL(v) { const m = /(-?\d+(?:\.\d+)?)°?\s*,\s*(-?\d+(?:\.\d+)?)°?/.exec(typeof v === 'string' ? v : ''); return m ? [+m[1], +m[2]] : null; }
function timelineTracks(j) {
  const segs = Array.isArray(j) ? j : (j.semanticSegments || []);
  const out = [];
  for (const s of segs) {
    if (!s.timelinePath) continue;
    const base = Date.parse(s.startTime);
    let cur = [], prev = null;
    for (const e of s.timelinePath) {
      const ll = parseLL(e.point || e.latLng);
      if (!ll) continue;
      let t = Date.parse(e.time);
      if (!t && e.durationMinutesOffsetFromStartTime) t = base + (+e.durationMinutesOffsetFromStartTime) * 60000;
      if (prev && t && prev.t) {
        const dt = (t - prev.t) / 1000, d = dist(prev.ll, ll);
        if (dt <= 0 || dt > 1800 || d / dt > 2.5) { if (cur.length > 1) out.push(cur); cur = []; }
      }
      cur.push(ll); prev = { ll, t };
    }
    if (cur.length > 1) out.push(cur);
  }
  return out;
}
const inLondon = p => p[0] > 51.28 && p[0] < 51.70 && p[1] > -0.51 && p[1] < 0.34;

// ---------- GPX import ----------
function parseGpx(text) {
  const doc = new DOMParser().parseFromString(text, 'application/xml');
  return [...doc.getElementsByTagName('trkpt')].map(p => [+p.getAttribute('lat'), +p.getAttribute('lon')]);
}
$('file').onchange = async e => {
  let n = 0; skipped = 0;
  for (const f of e.target.files) {
    try {
      if (/\.json$/i.test(f.name)) {
        const list = timelineTracks(JSON.parse(await f.text())).filter(t => t.some(inLondon));
        list.forEach((t, i) => { tracks[f.name + '#' + i] = t.map(p => [+p[0].toFixed(5), +p[1].toFixed(5)]); });
        n += list.length;
        if (!list.length) skipped++;
      } else if (/\.zip$/i.test(f.name)) {
        const z = await JSZip.loadAsync(f);
        for (const name of Object.keys(z.files)) {
          if (/\.gpx$/i.test(name)) { const pts = parseGpx(await z.files[name].async('string')); if (pts.length) { tracks[name] = pts.map(p => [+p[0].toFixed(5), +p[1].toFixed(5)]); n++; } else skipped++; }
        }
      } else {
        const pts = parseGpx(await f.text());
        if (pts.length) { tracks[f.name] = pts.map(p => [+p[0].toFixed(5), +p[1].toFixed(5)]); n++; } else skipped++;
      }
    } catch (err) { skipped++; }
  }
  await kvSet('tracks', tracks);
  msg(n + ' walk(s) imported. Loading street data…');
  await ensureCellsForTracks();
  recompute(true);
};

// ---------- Overpass ----------
const LAT_STEP = 0.05, LON_STEP = 0.08;
const cellKey = (la, lo) => Math.floor(la / LAT_STEP) + ',' + Math.floor(lo / LON_STEP);
const cellBox = k => { const [a, b] = k.split(',').map(Number); return [a*LAT_STEP, b*LON_STEP, (a+1)*LAT_STEP, (b+1)*LON_STEP]; };
const HW = 'residential|living_street|pedestrian|footway|path|service|tertiary|secondary|primary|unclassified|steps|cycleway|track|trunk|tertiary_link|secondary_link|primary_link';

async function fetchCell(k) {
  if (cells[k]) return;
  const [s, w, n, e] = cellBox(k), bb = `${s},${w},${n},${e}`;
  const q = `[out:json][timeout:90];(way["highway"~"^(${HW})$"]["footway"!~"sidewalk|crossing"]["access"!~"private|no"](${bb}););out geom;(node["amenity"="cafe"](${bb});way["amenity"="cafe"](${bb}););out center;`;
  for (let attempt = 0; attempt < 3; attempt++) {
    try {
      const r = await fetch('https://overpass-api.de/api/interpreter', { method: 'POST', body: 'data=' + encodeURIComponent(q) });
      if (!r.ok) throw new Error(r.status);
      const j = await r.json();
      const ways = [], cafes = [];
      for (const el of j.elements) {
        if (el.tags && el.tags.amenity === 'cafe') {
          const c = el.type === 'node' ? el : el.center;
          if (c) cafes.push({ id: el.type[0] + el.id, name: el.tags.name || 'Cafe', lat: c.lat, lon: c.lon });
        } else if (el.geometry) {
          ways.push({ id: el.id, pts: el.geometry.map(g => [+g.lat.toFixed(6), +g.lon.toFixed(6)]) });
        }
      }
      cells[k] = { ways, cafes };
      await kvSet('cells', cells);
      return;
    } catch (err) { await new Promise(r => setTimeout(r, 5000)); }
  }
  throw new Error('Overpass failed for a map cell; try again later.');
}
async function ensureCellsForTracks() {
  const keys = new Set();
  for (const pts of Object.values(tracks)) for (const p of pts) if (inLondon(p)) keys.add(cellKey(p[0], p[1]));
  loadedKeys = keys;
  let i = 0;
  for (const k of keys) {
    msg(`Loading map data ${++i}/${keys.size}…`);
    try { await fetchCell(k); } catch (err) { msg(err.message); }
  }
}
$('all').onclick = async () => {
  const keys = [];
  for (let la = 51.28; la < 51.70; la += LAT_STEP) for (let lo = -0.51; lo < 0.34; lo += LON_STEP) keys.push(cellKey(la, lo));
  const uniq = [...new Set(keys)];
  loadedKeys = new Set(uniq);
  let i = 0;
  for (const k of uniq) {
    msg(`Loading London ${++i}/${uniq.length} (cached after first time)…`);
    try { await fetchCell(k); } catch (err) { msg(err.message); break; }
    if (i % 5 === 0) recompute(false);
  }
  recompute(false);
};

// ---------- coverage ----------
function buildIndex() {
  const idx = new Map();
  const add = p => { const k = Math.floor(p[0] / 0.0003) + ',' + Math.floor(p[1] / 0.0005); (idx.get(k) || idx.set(k, []).get(k)).push(p); };
  for (const pts of Object.values(tracks)) {
    for (let i = 0; i < pts.length; i++) {
      add(pts[i]);
      if (i) { const d = dist(pts[i-1], pts[i]); if (d > 10 && d < 800) { const m = Math.ceil(d / 10); for (let j = 1; j < m; j++) add([pts[i-1][0] + (pts[i][0]-pts[i-1][0])*j/m, pts[i-1][1] + (pts[i][1]-pts[i-1][1])*j/m]); } }
    }
  }
  return idx;
}
function near(idx, p, r) {
  const a = Math.floor(p[0] / 0.0003), b = Math.floor(p[1] / 0.0005);
  for (let i = -1; i <= 1; i++) for (let j = -1; j <= 1; j++) {
    const c = idx.get((a+i) + ',' + (b+j)); if (!c) continue;
    for (const q of c) if (dist(p, q) <= r) return true;
  }
  return false;
}
function recompute(fit) {
  layer.clearLayers();
  const idx = buildIndex();
  let tot = 0, walked = 0, seenWays = new Set(), seenCafes = new Set(), cafeTot = 0, cafeVis = 0;
  const bounds = [];
  for (const k of loadedKeys) {
    const c = cells[k]; if (!c) continue;
    for (const w of c.ways) {
      if (seenWays.has(w.id)) continue; seenWays.add(w.id);
      let run = [w.pts[0]], runWalked = null;
      const flush = () => { if (run.length > 1) L.polyline(run, runWalked ? { color: '#2563eb', weight: 4, opacity: .9 } : { color: '#9ca3af', weight: 1.2, opacity: .6 }).addTo(layer); };
      for (let i = 1; i < w.pts.length; i++) {
        const a = w.pts[i-1], b = w.pts[i], len = dist(a, b);
        const mid = [(a[0]+b[0])/2, (a[1]+b[1])/2];
        const isW = near(idx, mid, 20) || near(idx, a, 20);
        tot += len; if (isW) walked += len;
        if (runWalked === null) runWalked = isW;
        if (isW !== runWalked) { flush(); run = [a]; runWalked = isW; }
        run.push(b);
      }
      flush();
    }
    for (const f of c.cafes) {
      if (seenCafes.has(f.id)) continue; seenCafes.add(f.id);
      const v = near(idx, [f.lat, f.lon], 30);
      cafeTot++; if (v) cafeVis++;
      L.circleMarker([f.lat, f.lon], v
        ? { radius: 7, color: '#92400e', weight: 2, fillColor: '#f59e0b', fillOpacity: 1 }
        : { radius: 5, color: '#78716c', weight: 1, fillColor: '#a8a29e', fillOpacity: .35 }
      ).bindPopup(f.name + (v ? ' ✓' : '')).addTo(layer);
    }
  }
  for (const pts of Object.values(tracks)) for (const p of pts) if (inLondon(p)) bounds.push(p);
  const pct = (a, b) => b ? (100 * a / b) : 0;
  $('s1').textContent = pct(walked, tot).toFixed(1) + '%';
  $('s1t').textContent = `${(walked/1000).toFixed(1)} of ${(tot/1000).toFixed(0)} km`;
  $('b1').style.width = pct(walked, tot) + '%';
  $('s2').textContent = `${cafeVis} / ${cafeTot}`;
  $('s2t').textContent = 'cafes visited';
  $('b2').style.width = pct(cafeVis, cafeTot) + '%';
  let tk = 0; for (const pts of Object.values(tracks)) for (let i = 1; i < pts.length; i++) { const d = dist(pts[i-1], pts[i]); if (d < 800) tk += d; }
  msg(`${Object.keys(tracks).length} walks read (${(tk/1000).toFixed(1)} km)` + (skipped ? `, ${skipped} unreadable` : '') + `. ${loadedKeys.size} map cell(s). Blue = walked, orange = visited cafe.`);
  if (fit && bounds.length) map.fitBounds(L.latLngBounds(bounds).pad(0.1));
}

// ---------- start ----------
(async () => {
  tracks = await kvGet('tracks', {});
  cells = await kvGet('cells', {});
  if (Object.keys(tracks).length) {
    for (const pts of Object.values(tracks)) for (const p of pts) if (inLondon(p)) loadedKeys.add(cellKey(p[0], p[1]));
    recompute(true);
  }
})();
</script>
</body>
</html>
